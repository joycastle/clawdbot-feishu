<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>倒计时</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: white;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            opacity: 0.8;
            animation: fadeIn 1s ease;
        }
        .countdown {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .time-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 1.5rem 1rem;
            min-width: 90px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: slideUp 0.5s ease backwards;
        }
        .time-box:nth-child(1) { animation-delay: 0.1s; }
        .time-box:nth-child(2) { animation-delay: 0.2s; }
        .time-box:nth-child(3) { animation-delay: 0.3s; }
        .time-box:nth-child(4) { animation-delay: 0.4s; }
        .number {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #e94560, #f39c12);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: pulse 1s ease infinite;
        }
        .label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.7;
            margin-top: 0.5rem;
        }
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            animation: fadeIn 1s ease 0.5s backwards;
        }
        input[type="datetime-local"] {
            padding: 0.8rem 1.2rem;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1rem;
            outline: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        button {
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #e94560, #f39c12);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.4);
        }
        .finished {
            font-size: 2rem;
            animation: bounce 0.5s ease infinite alternate;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }
        @media (max-width: 500px) {
            .countdown { gap: 0.5rem; }
            .time-box { min-width: 70px; padding: 1rem 0.5rem; }
            .number { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <h1>⏰ 倒计时</h1>
    <div class="countdown">
        <div class="time-box">
            <div class="number" id="days">00</div>
            <div class="label">天</div>
        </div>
        <div class="time-box">
            <div class="number" id="hours">00</div>
            <div class="label">时</div>
        </div>
        <div class="time-box">
            <div class="number" id="minutes">00</div>
            <div class="label">分</div>
        </div>
        <div class="time-box">
            <div class="number" id="seconds">00</div>
            <div class="label">秒</div>
        </div>
    </div>
    <div class="controls">
        <input type="datetime-local" id="targetDate">
        <button onclick="startCountdown()">开始倒计时</button>
    </div>

    <script>
        let targetTime = null;
        let interval = null;

        // 默认设置为 1 小时后
        const now = new Date();
        now.setHours(now.getHours() + 1);
        document.getElementById('targetDate').value = now.toISOString().slice(0, 16);

        function startCountdown() {
            const input = document.getElementById('targetDate').value;
            if (!input) return;
            targetTime = new Date(input).getTime();
            if (interval) clearInterval(interval);
            interval = setInterval(updateCountdown, 1000);
            updateCountdown();
        }

        function updateCountdown() {
            if (!targetTime) return;
            const now = new Date().getTime();
            const diff = targetTime - now;

            if (diff <= 0) {
                clearInterval(interval);
                document.querySelector('.countdown').innerHTML = '<div class="finished">🎉 时间到！</div>';
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
        }

        // 自动开始
        startCountdown();
    </script>
</body>
</html>
