    <title>Token 使用统计 - 过去30天</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2em;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stat-label {
            color: #aaa;
            margin-top: 5px;
        }
        .chart-container {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .chart-title {
            font-size: 1.2em;
            margin-bottom: 15px;
            color: #ddd;
        }
        .legend-item {
            display: inline-flex;
            align-items: center;
            margin-right: 20px;
            font-size: 0.9em;
            color: #aaa;
        }
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            margin-right: 6px;
        }
        canvas {
            max-height: 400px;
        }
    </style>
</head>

            <div class="stat-card">

            </div>
            <div class="stat-card">
                <div class="stat-value" id="avgDaily">-</div>
                <div class="stat-label">日均 Token</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="peakDay">-</div>
                <div class="stat-label">峰值日期</div>
            </div>
        </div>

        <div class="chart-container">
            <div class="chart-title">📊 每日 Token 消耗</div>
            <canvas id="tokenChart"></canvas>
        </div>

        <div class="chart-container">

                <span class="legend-item"><span class="legend-color" style="background:#00ff88"></span>Cache Read</span>
                <span class="legend-item"><span class="legend-color" style="background:#ff6b6b"></span>Cache Write</span>

            <canvas id="breakdownChart"></canvas>

        // Calculate stats
        const activeDays = data.filter(d => d.total > 0);
        const totalTokens = data.reduce((sum, d) => sum + d.total, 0);
        const totalCost = data.reduce((sum, d) => sum + d.cost, 0);
        const avgDaily = activeDays.length > 0 ? totalTokens / activeDays.length : 0;
        const peakDay = activeDays.reduce((max, d) => d.total > max.total ? d : max, {total: 0, date: '-'});

        // Format numbers
        function formatNumber(num) {
            if (num >= 1e9) return (num / 1e9).toFixed(1) + 'B';
            if (num >= 1e6) return (num / 1e6).toFixed(1) + 'M';
            if (num >= 1e3) return (num / 1e3).toFixed(1) + 'K';
            return num.toFixed(0);
        }

        // Update stats
        document.getElementById('totalTokens').textContent = formatNumber(totalTokens);
        document.getElementById('totalCost').textContent = '$' + totalCost.toFixed(2);
        document.getElementById('avgDaily').textContent = formatNumber(avgDaily);
        document.getElementById('peakDay').textContent = peakDay.date.slice(5);

        const chartOptions = {
